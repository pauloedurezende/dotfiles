---
- name: Create OpenCode configuration directory
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}"
    state: directory
    mode: '0755'

- name: Create OpenCode instructions directory
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}/instructions"
    state: directory
    mode: '0755'

- name: Copy OpenCode configuration
  ansible.builtin.copy:
    src: opencode.jsonc
    dest: "{{ opencode_config_dir }}/opencode.jsonc"
    mode: '0644'
    backup: true

- name: Copy OpenCode instructions
  ansible.builtin.copy:
    src: "instructions/{{ item }}.md"
    dest: "{{ opencode_config_dir }}/instructions/{{ item }}.md"
    mode: '0644'
    backup: true
  loop:
    - codegraph
    - rtk
    - figma
    - untitledui

- name: Remove legacy OpenCode agents
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}/agent/{{ item }}.md"
    state: absent
  loop:
    - codegraph
    - rtk
    - figma
    - untitledui

- name: Remove deployed OpenCode global instructions
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}/AGENTS.md"
    state: absent

- name: Copy oh-my-opencode-slim configuration
  ansible.builtin.copy:
    src: oh-my-opencode-slim.jsonc
    dest: "{{ opencode_config_dir }}/oh-my-opencode-slim.jsonc"
    mode: '0644'
    backup: true

- name: Copy OpenCode notifier configuration
  ansible.builtin.copy:
    src: opencode-notifier.json
    dest: "{{ opencode_config_dir }}/opencode-notifier.json"
    mode: '0644'
    backup: true
  when: is_macos

- name: Configure OpenCode background subagents in shell profile
  ansible.builtin.blockinfile:
    path: "{{ opencode_shell_profile }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: OpenCode background subagents"
    block: |
      export OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS=true
    create: true
    mode: '0644'
    state: >-
      {{ opencode_background_subagents_enabled | ternary('present', 'absent') }}

- name: Configure OpenCode native websearch in shell profile
  ansible.builtin.blockinfile:
    path: "{{ opencode_shell_profile }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: OpenCode native websearch"
    block: |
      export OPENCODE_ENABLE_EXA=true
      export OPENCODE_ENABLE_PARALLEL=true
    create: true
    mode: '0644'
    state: >-
      {{ opencode_builtin_websearch_enabled | ternary('present', 'absent') }}

- name: Install CodeGraph globally via npm
  community.general.npm:
    name: "@colbymchenry/codegraph"
    global: true
    state: latest
    executable: "{{ asdf_dir }}/shims/npm"
  environment:
    ASDF_DATA_DIR: "{{ asdf_dir }}"
    PATH: >-
      {{ opencode_macos_tool_path
         if is_macos
         else opencode_linux_tool_path }}
  when: opencode_codegraph_enabled and not ansible_check_mode

- name: Verify CodeGraph installation
  ansible.builtin.command: codegraph --version
  register: opencode_codegraph_version
  changed_when: false
  environment:
    PATH: >-
      {{ opencode_macos_tool_path
         if is_macos
         else opencode_linux_tool_path }}
  when: opencode_codegraph_enabled

- name: Initialize RTK for OpenCode
  ansible.builtin.command: rtk init -g --opencode
  register: opencode_rtk_init_result
  changed_when: "'already up to date' not in opencode_rtk_init_result.stdout"
  environment:
    PATH: >-
      {{ opencode_macos_tool_path
         if is_macos
         else opencode_linux_tool_path }}
  when: opencode_rtk_enabled
