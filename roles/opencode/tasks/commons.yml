---
- name: Create OpenCode configuration directory
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}"
    state: directory
    mode: '0755'

- name: Generate OpenCode v2 configuration
  ansible.builtin.template:
    src: opencode.jsonc.j2
    dest: "{{ opencode_config_dir }}/opencode.jsonc"
    mode: '0644'
    backup: true

- name: Generate oh-my-opencode-slim configuration
  ansible.builtin.template:
    src: oh-my-opencode-slim.jsonc.j2
    dest: "{{ opencode_config_dir }}/oh-my-opencode-slim.jsonc"
    mode: '0644'
    backup: true

- name: Generate OpenCode CLI configuration
  ansible.builtin.template:
    src: cli.json.j2
    dest: "{{ opencode_config_dir }}/cli.json"
    mode: '0644'
    backup: true

- name: Copy OpenCode global instructions
  ansible.builtin.copy:
    src: AGENTS.md
    dest: "{{ opencode_config_dir }}/AGENTS.md"
    mode: '0644'
    backup: true

- name: Verify OpenCode installation
  ansible.builtin.command: opencode --version
  register: opencode_version_check
  changed_when: false
  environment:
    PATH: >-
      {{ opencode_macos_tool_path
         if is_macos
         else opencode_linux_tool_path }}

- name: Install CodeGraph globally via npm
  community.general.npm:
    name: "@colbymchenry/codegraph"
    global: true
    state: present
    executable: "{{ asdf_dir }}/shims/npm"
  environment:
    ASDF_DATA_DIR: "{{ asdf_dir }}"
    PATH: >-
      {{ opencode_macos_tool_path
         if is_macos
         else opencode_linux_tool_path }}
  when: not ansible_check_mode

- name: Verify CodeGraph installation
  ansible.builtin.command: codegraph --version
  register: opencode_codegraph_version
  changed_when: false
  environment:
    PATH: >-
      {{ opencode_macos_tool_path
         if is_macos
         else opencode_linux_tool_path }}
