---
- name: Check if plugin is already installed
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ asdf_binary_install_path }}:{{ asdf_dir }}/shims:${PATH}"
    export ASDF_DATA_DIR="{{ asdf_dir }}"
    asdf plugin list | grep -w "{{ plugin.name }}"
  args:
    executable: /bin/zsh
  register: asdf_plugin_check
  changed_when: false
  failed_when: false

- name: Add asdf plugin
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ asdf_binary_install_path }}:{{ asdf_dir }}/shims:${PATH}"
    export ASDF_DATA_DIR="{{ asdf_dir }}"
    asdf plugin add "{{ plugin.name }}" "{{ plugin.url }}"
  args:
    executable: /bin/zsh
  when: asdf_plugin_check.rc != 0
  changed_when: true
  retries: 3
  delay: 5

- name: Resolve concrete versions for plugin
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ asdf_binary_install_path }}:{{ asdf_dir }}/shims:${PATH}"
    export ASDF_DATA_DIR="{{ asdf_dir }}"
    case "{{ item }}" in
      latest)
        asdf latest "{{ plugin.name }}"
        ;;
      latest:*)
        asdf latest "{{ plugin.name }}" "${item#latest:}"
        ;;
      *)
        echo "{{ item }}"
        ;;
    esac
  args:
    executable: /bin/zsh
  loop: "{{ plugin.versions }}"
  register: asdf_resolved_versions
  changed_when: false

- name: Build resolved versions list
  ansible.builtin.set_fact:
    asdf_plugin_resolved_versions: >-
      {{ asdf_resolved_versions.results | map(attribute='stdout') | list }}

- name: Install plugin versions
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ asdf_binary_install_path }}:{{ asdf_dir }}/shims:${PATH}"
    export ASDF_DATA_DIR="{{ asdf_dir }}"
    asdf install "{{ plugin.name }}" "{{ item }}"
  args:
    executable: /bin/zsh
  loop: "{{ asdf_plugin_resolved_versions }}"
  register: asdf_install_result
  changed_when: >-
    'already installed' not in
    (asdf_install_result.stderr | default(''))
  retries: 3
  delay: 5

- name: Set global version
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ asdf_binary_install_path }}:{{ asdf_dir }}/shims:${PATH}"
    export ASDF_DATA_DIR="{{ asdf_dir }}"
    asdf set -u "{{ plugin.name }}" "{{ asdf_plugin_resolved_versions[0] }}"
  args:
    executable: /bin/zsh
  when: plugin.global is defined
  changed_when: true

- name: Verify plugin installation
  ansible.builtin.shell: |
    set -o pipefail
    export PATH="{{ asdf_binary_install_path }}:{{ asdf_dir }}/shims:${PATH}"
    export ASDF_DATA_DIR="{{ asdf_dir }}"
    asdf current "{{ plugin.name }}"
  args:
    executable: /bin/zsh
  register: asdf_plugin_version_output
  changed_when: false
