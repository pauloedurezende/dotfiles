---
- name: Get user's current login shell
  ansible.builtin.command: "getent passwd {{ ansible_facts['user_id'] }}"
  register: zsh_current_shell
  changed_when: false

- name: Install zsh via package manager
  ansible.builtin.package:
    name: zsh
    state: present
  become: true

- name: Add zsh to /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ zsh_linux_binary_path }}"
    state: present
  become: true
  when: zsh_set_default_shell

- name: Set zsh as default shell
  ansible.builtin.command: chsh -s {{ zsh_linux_binary_path }}
  when:
    - zsh_set_default_shell
    - zsh_linux_binary_path not in zsh_current_shell.stdout
  changed_when: true
